<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para mi Izzy 💙</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="titulo">Para mi Izzie 💙</h1>
  <p class="hint">toca cada nota para abrirla</p>

  <div class="board">

    <div class="sticky s1" onclick="toggle(this)">
      <div class="pin"></div>
      <div class="sticky-icon">💌</div>
      <div class="sticky-text">Te amo mi Izzie</div>
      <div class="heart-float">💙</div>
      <span class="tap-hint">abrir</span>
    </div>

    <div class="sticky s2" onclick="toggle(this)">
      <div class="pin"></div>
      <div class="sticky-icon">⭐</div>
      <div class="sticky-text">11:11 eres mi deseo más profundo</div>
      <div class="heart-float">✨</div>
      <span class="tap-hint">abrir</span>
    </div>

    <div class="sticky s3" onclick="toggle(this)">
      <div class="pin"></div>
      <div class="sticky-icon">🌊</div>
      <div class="sticky-text">Amarnos aun cuando nos odiamos</div>
      <div class="heart-float">💙</div>
      <span class="tap-hint">abrir</span>
    </div>

    <div class="sticky s4" onclick="toggle(this)">
      <div class="pin"></div>
      <div class="sticky-icon">👴</div>
      <div class="sticky-text">Te amaré cuando seamos ancianos seniles y apestosos</div>
      <div class="heart-float">👴</div>
      <span class="tap-hint">abrir</span>
    </div>

    <div class="sticky s5" onclick="toggle(this)">
      <div class="pin"></div>
      <div class="sticky-icon">❤️</div>
      <div class="sticky-text">Eres el amor de mi vida</div>
      <div class="heart-float">💙</div>
      <span class="tap-hint">abrir</span>
    </div>

    <div class="sticky s6" onclick="toggle(this)">
      <div class="pin"></div>
      <div class="sticky-icon">💍</div>
      <div class="sticky-text">Cásemonos 💙</div>
      <div class="heart-float">💍</div>
      <span class="tap-hint">abrir</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
